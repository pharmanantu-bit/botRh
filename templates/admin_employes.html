<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des employés</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
    .carte { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 30px; max-width: 800px; margin: 0 auto; }
    .entete { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { color: #1F4E79; font-size: 1.3em; }
    .btn-retour { color: #888; font-size: 0.85em; text-decoration: none; }
    .message { background: #C6EFCE; color: #276221; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9em; }

    /* Formulaire ajout */
    .form-ajout { background: #f5f8fc; border: 1px solid #dde3ed; border-radius: 10px; padding: 20px; margin-bottom: 28px; }
    .form-ajout h2 { color: #1F4E79; font-size: 1em; margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .form-row input { flex: 1; min-width: 140px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9em; }
    .btn-ajouter { padding: 8px 20px; background: #1F4E79; color: white; border: none; border-radius: 6px; font-size: 0.9em; font-weight: bold; cursor: pointer; }
    .btn-ajouter:hover { background: #163d60; }

    /* Tableau employés */
    table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    th { background: #1F4E79; color: white; padding: 10px 8px; text-align: left; }
    tr:nth-child(even) td { background: #f5f8fc; }
    td { padding: 8px; border: 1px solid #ddd; vertical-align: middle; }
    .btn-dossier { background: #1a7a6e; color: white; padding: 5px 12px; border-radius: 4px; font-size: 0.8em; text-decoration: none; font-weight: bold; }
    .btn-dossier:hover { background: #145f56; }
    .btn-edit { background: #2E75B6; color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
    .btn-del { background: #c0392b; color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8em; margin-left: 4px; }

    /* Modal modification */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center; }
    .modal.actif { display:flex; }
    .modal-box { background:white; border-radius:12px; padding:28px; max-width:420px; width:90%; }
    .modal-box h2 { color:#1F4E79; font-size:1em; margin-bottom:16px; }
    .modal-box input { width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:6px; font-size:0.9em; margin-bottom:10px; }
    .modal-actions { display:flex; gap:10px; margin-top:8px; }
    .btn-save { flex:1; padding:10px; background:#1F4E79; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
    .btn-cancel { flex:1; padding:10px; background:#888; color:white; border:none; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>
{% include '_admin_nav.html' %}
<div class="carte">
  <div class="entete">
    <h1>Gestion des employés ({{ employes|length }})</h1>
    <a href="/admin" class="btn-retour">Retour admin</a>
  </div>

  {% if message %}
  <div class="message">{{ message }}</div>
  {% endif %}

  <!-- Formulaire ajout -->
  <div class="form-ajout">
    <h2>Ajouter un employé</h2>
    <form method="POST" action="/admin/employes">
      <input type="hidden" name="action" value="ajouter">
      <div class="form-row">
        <input type="text" name="prenom" placeholder="Prénom" required>
        <input type="text" name="nom" placeholder="Nom" required>
        <input type="email" name="email" placeholder="Email" required>
        <button type="submit" class="btn-ajouter">Ajouter</button>
      </div>
    </form>
  </div>

  <!-- Liste employés -->
  <table>
    <thead>
      <tr><th>Prénom</th><th>Nom</th><th>Email</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for emp in employes %}
      <tr>
        <td>{{ emp.prenom }}</td>
        <td>{{ emp.nom }}</td>
        <td>{{ emp.email }}</td>
        <td>
          <a class="btn-dossier" href="/admin/employe?email={{ emp.email|urlencode }}">📁 Dossier</a>
          <button class="btn-edit" onclick="ouvrirModal('{{ emp.prenom }}','{{ emp.nom }}','{{ emp.email }}')">Modifier</button>
          <form method="POST" action="/admin/employes" style="display:inline;" onsubmit="return confirm('Supprimer {{ emp.prenom }} {{ emp.nom }} ?')">
            <input type="hidden" name="action" value="supprimer">
            <input type="hidden" name="email" value="{{ emp.email }}">
            <button type="submit" class="btn-del">Supprimer</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<!-- Modal modification -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>Modifier l'employé</h2>
    <form method="POST" action="/admin/employes">
      <input type="hidden" name="action" value="modifier">
      <input type="hidden" name="email_orig" id="email_orig">
      <input type="text" name="prenom" id="mod_prenom" placeholder="Prénom" required>
      <input type="text" name="nom" id="mod_nom" placeholder="Nom" required>
      <input type="email" name="email" id="mod_email" placeholder="Email" required>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="fermerModal()">Annuler</button>
        <button type="submit" class="btn-save">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<script>
function ouvrirModal(prenom, nom, email) {
  document.getElementById('mod_prenom').value = prenom;
  document.getElementById('mod_nom').value = nom;
  document.getElementById('mod_email').value = email;
  document.getElementById('email_orig').value = email;
  document.getElementById('modal').classList.add('actif');
}
function fermerModal() {
  document.getElementById('modal').classList.remove('actif');
}
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) fermerModal();
});
</script>
</body>
</html>
