<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1F4E79">
  <title>Déconnexion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
    .carte { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 36px 26px; max-width: 480px; margin: 60px auto 0; text-align: center; }
    h1 { color: #1F4E79; font-size: 1.2em; margin-bottom: 10px; }
    p { color: #556; font-size: 0.92em; line-height: 1.6; }
  </style>
</head>
<body>
<div class="carte">
  <h1>🚪 Vous avez quitté votre espace</h1>
  <p>À bientôt ! Pour revenir, rouvrez votre <strong>lien personnel</strong> (reçu par e-mail) ou l'icône <strong>Mon espace</strong> installée sur votre téléphone.</p>
  <p style="margin-top:10px; color:#9aa7b5; font-size:0.8em;">Sur un appareil partagé, pensez aussi à fermer cet onglet.</p>
</div>
</body>
</html>
