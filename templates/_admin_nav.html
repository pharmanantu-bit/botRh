<!-- Barre latérale fixe repliable — incluse sur toutes les pages admin.
     Sur mobile (≤ 820px) : menu fermé par défaut, ouverture en surimpression
     avec fond sombre cliquable, le contenu n'est jamais décalé. -->
<button class="nav-burger" onclick="toggleNav()" aria-label="Afficher le menu">☰</button>
<div class="nav-backdrop" onclick="toggleNav()" aria-hidden="true"></div>
<nav class="nav-drawer" id="navDrawer" aria-label="Navigation admin">
  <div class="nav-head">
    <span class="nav-logo">💊 botRh</span>
    <button class="nav-close" onclick="toggleNav()" aria-label="Replier le menu" title="Replier">«</button>
  </div>
  <form method="GET" action="/admin/recherche" class="nav-search">
    <input type="search" name="q" placeholder="🔎 Rechercher…" aria-label="Recherche globale">
  </form>
  <a href="/admin/dashboard">📊 <span>Tableau de bord</span></a>
  <a href="/admin/mois">🏠 <span>Relevés du mois</span></a>
  <a href="/admin/employes">👥 <span>Équipe & RH</span></a>
  <a href="/admin/planning-equipe">🗓️ <span>Planning</span></a>
  <a href="/admin/recrutement">🧲 <span>Recrutement</span></a>
  <a href="/admin/assistant">🤖 <span>Assistant RH</span></a>
  <a href="/admin/sauvegarde" class="nav-bas">💾 <span>Sauvegarde</span></a>
  <a href="/admin/securite">🔐 <span>Sécurité (2FA)</span></a>
  <a href="/admin/logout" class="nav-logout">🚪 <span>Déconnexion</span></a>
</nav>

<style>
  /* Barre visible par défaut : le contenu est décalé à droite */
  body { padding-left: 240px; transition: padding-left 0.22s ease; }
  body.nav-collapse { padding-left: 56px; }
  @media print { body { padding-left: 0 !important; } }
  .no-trans, .no-trans * { transition: none !important; }

  .nav-burger {
    position: fixed; top: 14px; left: 10px; z-index: 1102; display: none;
    width: 40px; height: 40px; border: none; border-radius: 10px;
    background: #1F4E79; color: white; font-size: 1.2em; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); line-height: 1;
  }
  .nav-burger:hover { background: #163d60; }
  body.nav-collapse .nav-burger { display: block; }

  .nav-drawer {
    position: fixed; top: 0; left: 0; height: 100%; width: 240px; z-index: 1101;
    background: #1F4E79; color: white; padding: 14px 0;
    transform: none; transition: transform 0.22s ease;
    box-shadow: 2px 0 14px rgba(0,0,0,0.18); overflow-y: auto;
    display: flex; flex-direction: column;
  }
  body.nav-collapse .nav-drawer { transform: translateX(-100%); }
  .nav-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.15); margin-bottom: 10px; }
  .nav-search { padding: 0 14px 12px; }
  .nav-search input {
    width: 100%; padding: 8px 12px; border: none; border-radius: 8px;
    background: rgba(255,255,255,0.14); color: white; font-size: 0.88em;
  }
  .nav-search input::placeholder { color: #b9c9dc; }
  .nav-search input:focus { outline: none; background: rgba(255,255,255,0.24); }
  .nav-logo { font-size: 1.15em; font-weight: bold; letter-spacing: 0.5px; }
  .nav-close { background: rgba(255,255,255,0.12); border: none; color: white; font-size: 1.2em; cursor: pointer; line-height: 1; width: 28px; height: 28px; border-radius: 6px; }
  .nav-close:hover { background: rgba(255,255,255,0.25); }
  .nav-drawer a {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; color: #dce6f2; text-decoration: none;
    font-size: 0.95em; transition: background 0.15s, color 0.15s;
  }
  .nav-drawer a span { font-weight: 500; }
  .nav-drawer a:hover { background: rgba(255,255,255,0.1); color: white; }
  .nav-drawer a.actif { background: #fff; color: #1F4E79; font-weight: bold; }
  .nav-drawer a.actif span { font-weight: bold; }
  /* Groupe du bas : Sauvegarde + Sécurité rangées à côté de Déconnexion */
  .nav-bas { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.15); }
  .nav-logout { color: #ffd5d5 !important; }
  .nav-logout:hover { background: rgba(255,255,255,0.12); }
  .nav-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,25,40,0.5); z-index: 1100; }

  /* ===== Mobile : menu en surimpression, contenu jamais décalé ===== */
  @media (max-width: 820px) {
    body, body.nav-collapse { padding-left: 0; padding-top: 62px; }
    .nav-burger { display: block; top: 11px; }
    body:not(.nav-collapse) .nav-burger { display: none; }
    .nav-drawer { width: min(78vw, 300px); }
    /* Liens plus hauts = cibles tactiles confortables */
    .nav-drawer a { padding: 15px 20px; font-size: 1em; }
    .nav-close { width: 36px; height: 36px; font-size: 1.35em; }
    /* Menu ouvert → fond sombre cliquable pour refermer, page figée derrière */
    body:not(.nav-collapse) .nav-backdrop { display: block; }
    body:not(.nav-collapse) { overflow: hidden; }
    /* Les tableaux larges défilent dans la page au lieu d'élargir tout l'écran */
    table { display: block; overflow-x: auto; max-width: 100%; }
  }
  @media print { .nav-burger, .nav-drawer, .nav-backdrop { display: none !important; } }
</style>

<script>
  var navMobile = window.matchMedia('(max-width: 820px)');
  function toggleNav() {
    var col = document.body.classList.toggle('nav-collapse');
    // L'état mémorisé ne concerne que le desktop : sur mobile le menu
    // repart toujours fermé à la page suivante.
    if (!navMobile.matches) {
      try { localStorage.setItem('navCollapse', col ? '1' : '0'); } catch (e) {}
    }
  }
  (function () {
    // Mobile : toujours fermé au chargement. Desktop : restaure l'état mémorisé.
    var ferme = navMobile.matches;
    try { if (!ferme) ferme = localStorage.getItem('navCollapse') === '1'; } catch (e) {}
    if (ferme) {
      document.body.classList.add('no-trans', 'nav-collapse');
      requestAnimationFrame(function () { document.body.classList.remove('no-trans'); });
    }
    // Échap referme le menu sur mobile
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && navMobile.matches && !document.body.classList.contains('nav-collapse')) toggleNav();
    });
    // Surligne le lien de la page courante
    var path = window.location.pathname.replace(/\/+$/, '') || '/admin';
    var best = null;
    document.querySelectorAll('.nav-drawer a').forEach(function (a) {
      var h = a.getAttribute('href');
      if (path === h) best = a;
      else if (h !== '/admin' && path.indexOf(h) === 0 && (!best || h.length > best.getAttribute('href').length)) best = a;
    });
    if (best) best.classList.add('actif');
  })();
</script>
