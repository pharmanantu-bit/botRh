name: Envoi mensuel botRh

# L'envoi est fait ICI (runner GitHub, accès Internet complet) et non sur le
# serveur PythonAnywhere gratuit, qui bloque le SMTP sortant.
# Le serveur ne sert qu'à héberger les pages et fournir /export_reponses.

on:
  schedule:
    # Heures en UTC. 06:00 UTC = 08:00 Paris (été) / 07:00 (hiver).
    - cron: '0 6 20 * *'   # le 20 : relevés
    - cron: '0 6 22 * *'   # le 22 : relances
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'envoi (test = 1 mail à l'admin)"
        required: false
        default: "test"
        type: choice
        options: [test, auto, releves, relances]

jobs:
  envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: pip install python-dotenv
      - name: Envoi
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_send.py "${{ github.event.inputs.mode }}"
